# Cloud Run service: litellm (compose: litellm), the AI gateway. No public run.app access:
# engine services call it on its run.app URL through the VPC (master key / virtual keys), and the
# admin console is only reachable as gateway.<domain> through the ALB, where IAP (Google
# identity, roles/iap.httpsResourceAccessor) replaces Caddy's platform-admin forward_auth.
# Image: infra/cloudrun/images/litellm.Dockerfile (config.yaml baked in).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: litellm
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/part-of: keelson
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: keelson
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        # Cloud SQL private IP through the VPC; provider calls (Gemini) leave directly.
        run.googleapis.com/network-interfaces: '[{"network":"${NETWORK}","subnetwork":"${SUBNET}"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: keelson-litellm@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 900
      containers:
        - name: litellm
          image: ${IMAGE_LITELLM}
          args: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
          ports:
            - name: http1
              containerPort: 4000
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          env:
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: UI_USERNAME
              value: admin
            - name: PROXY_BASE_URL
              value: https://gateway.${DOMAIN}
            - name: LITELLM_LOG
              value: INFO
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: keelson-litellm-database-url
                  key: latest
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: keelson-litellm-master-key
                  key: latest
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: keelson-litellm-salt-key
                  key: latest
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keelson-litellm-ui-password
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: keelson-gemini-api-key
                  key: latest
