[project]
name = "keelson-contracts"
version = "0.1.0"
description = "Shared Keelson contracts (Pydantic): render blocks, AG-UI metadata, runs, LLM schemas, scenarios, change-sets, optimizer API."
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
agui = ["ag-ui-protocol==1.0.0"]

[dependency-groups]
dev = ["pytest>=8.4", "ag-ui-protocol==1.0.0", "mypy>=1.18"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keelson_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/keelson_contracts", "scripts"]
