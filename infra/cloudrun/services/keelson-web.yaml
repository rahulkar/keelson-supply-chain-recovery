# Cloud Run service: keelson-web (compose: keelson-web). Next.js standalone server. Public only
# through the ALB (keelson.<domain>, every path except /api). Server components call engine-api
# on its run.app URL through the VPC (engine-api has internal + load-balancer ingress).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: keelson-web
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/part-of: keelson
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: keelson
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/network-interfaces: '[{"network":"${NETWORK}","subnetwork":"${SUBNET}"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      serviceAccountName: keelson-web@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: keelson-web
          image: ${IMAGE_KEELSON_WEB}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          env:
            # The Next standalone server binds to HOSTNAME; keep it on all interfaces.
            - name: HOSTNAME
              value: 0.0.0.0
            - name: ENGINE_API_INTERNAL_URL
              value: ${URL_ENGINE_API}
            - name: BRAND_ENGINE_NAME
              value: ${BRAND_ENGINE_NAME}
            # network map base map (docs/contracts/127): protomaps with --enable-basemap, else auto
            - name: KEELSON_BASEMAP
              value: ${KEELSON_BASEMAP}
