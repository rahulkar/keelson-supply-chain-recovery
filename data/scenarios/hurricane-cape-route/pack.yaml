# Demo pack (docs/contracts/124-m8-signal-feeds.md §5). SIMULATED: the fictional Hurricane ALBATROSS
# (AL992026). Replayed by the Signal Hub through the real NHC adapter (fixtures served at
# /demo-feeds/hurricane-cape-route/<file>); everything it produces is origin demo / provenance simulated
# and alerts carry simulated: true (DEMO badge).
# Fixtures nhc-adv*.json / *.kml are generated by data/scenarios/tools/gen_hurricane_cape_route.py (do not hand-edit).
# Check with: python data/scenarios/validate.py hurricane-cape-route   (expected exposures: expected.yaml)
id: hurricane-cape-route
title: Hurricane Albatross over the Cape route off West Africa (simulated)
description: >-
  SIMULATED. Three NHC-shaped advisories, 6 hours apart, for the fictional Hurricane ALBATROSS (AL992026)
  forming off Guinea and tracking north-west along the West African coast: a category-1 hurricane that
  rapidly intensifies to category 3. Its forecast cone lies across the Cape-of-Good-Hope shipping lanes
  off Senegal and Mauritania. Expected exposure: lanes only (the four CAPE-routed lanes CGP-FXT-SEA,
  CGP-RTM-SEA, SGN-HAM-CAPE and SGN-GDN-CAPE); no supplier, factory or port is near, so the alert stays
  an alert (no case is drafted) while it re-notifies at the category-3 advisory.
start_at: "2026-10-12T00:00:00Z"
steps:
  - t_offset_s: 0
    adapter: nhc
    payload:
      fixture: nhc-adv1.json
      gis: {al992026: [nhc-adv1-cone.kml, nhc-adv1-track.kml]}
    note: "Advisory 7 (00:00Z): Hurricane Albatross, 70 kt (category 1), off Guinea; the cone lies across the Cape route"
  - t_offset_s: 21600
    adapter: nhc
    payload:
      fixture: nhc-adv2.json
      gis: {al992026: [nhc-adv2-cone.kml, nhc-adv2-track.kml]}
    note: "Advisory 8 (06:00Z): rapid intensification to 100 kt (category 3): severity 6500 → 8500 re-notifies"
  - t_offset_s: 43200
    adapter: nhc
    payload:
      fixture: nhc-adv3.json
      gis: {al992026: [nhc-adv3-cone.kml, nhc-adv3-track.kml]}
    note: "Advisory 9 (12:00Z): 110 kt, still category 3, moving north-west off Guinea-Bissau (the alert is edited)"
  - t_offset_s: 43200
    adapter: chat_hint
    payload: {text: "Open the alert, then ask: what if the Cape-routed sailings lose four days to the hurricane?"}
    note: "Presenter hint"
