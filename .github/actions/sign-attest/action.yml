# Build, scan, sign and attest one release image (docs/supply-chain.md, docs/contracts/129-m8-supply-chain.md §5).
# Used by .github/workflows/release.yml only. The calling job needs: contents: read, packages: write,
# id-token: write (keyless Sigstore signing with the workflow's OIDC identity), attestations: write.
#
#   push by digest (linux/amd64, one manifest: no BuildKit attestations - Cloud Run takes single images)
#   -> check-image.sh (non-root, no litellm_init.pth / executable .pth, no secrets, OCI labels)
#   -> Syft SPDX SBOM -> Grype gate (critical with a fix fails; .grype.yaml lists accepted findings)
#   -> cosign sign (keyless; annotations git_sha, image[, domain]) -> cosign attest (SPDX)
#   -> SLSA v1 build provenance (actions/attest-build-provenance, pushed to the registry)
#   -> artifact ref-<name>: one line <RELEASE_KEY>=<registry>/<name>@sha256:<digest> for the release file
name: sign-attest
description: Build, push, scan, sign and attest one Keelson release image by digest
inputs:
  name:
    description: image name in infra/supply-chain/images.json (also the repository below the registry)
    required: true
  dockerfile:
    description: Dockerfile path
    required: true
  context:
    description: build context
    required: true
  target:
    description: build target ('' = the last stage)
    required: false
    default: ""
  release-key:
    description: RELEASE_IMAGE_<KEY> suffix in keelson-release.env
    required: true
  registry:
    description: release registry prefix (RELEASE_REGISTRY of infra/supply-chain/signing.env)
    required: true
  build-args:
    description: newline separated KEY=value build arguments
    required: false
    default: ""
  domain:
    description: public domain of a domain overlay (adds the signature annotation domain=<domain>)
    required: false
    default: ""
  upstream-key:
    description: versions.env key of an upstream image to verify with upstream-pubkey before building on it
    required: false
    default: ""
  upstream-pubkey:
    description: publisher cosign public key for upstream-key
    required: false
    default: ""
  github-token:
    description: token for ghcr.io (GITHUB_TOKEN with packages write)
    required: true
outputs:
  ref:
    description: pushed image <registry>/<name>@sha256:<digest>
    value: ${{ steps.out.outputs.ref }}
runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3

    - name: Verify the upstream image with its publisher key
      if: inputs.upstream-key != ''
      shell: bash
      env:
        UPSTREAM_KEY: ${{ inputs.upstream-key }}
        UPSTREAM_PUBKEY: ${{ inputs.upstream-pubkey }}
      run: |
        ref="$(sed -n "s/^${UPSTREAM_KEY}=//p" infra/cloudrun/versions.env)"
        [ -n "$ref" ] || { echo "::error::${UPSTREAM_KEY} not found in infra/cloudrun/versions.env"; exit 1; }
        bash scripts/supply-chain/verify-images.sh --upstream "$ref" "$UPSTREAM_PUBKEY"

    - name: Tags and labels
      id: meta
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        NAME: ${{ inputs.name }}
      run: |
        repo="${REGISTRY}/${NAME}"
        [[ "$repo" =~ ^[a-z0-9.-]+(/[a-z0-9._-]+)+$ ]] || { echo "::error::bad image repository $repo"; exit 1; }
        tags="${repo}:sha-${GITHUB_SHA:0:12}"
        if [[ "$GITHUB_REF" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then tags+=$'\n'"${repo}:${BASH_REMATCH[1]}"; fi
        created="$(git show -s --format=%cI HEAD)"
        {
          echo "repo=${repo}"
          echo "tags<<EOF"; echo "$tags"; echo "EOF"
          echo "labels<<EOF"
          echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          echo "org.opencontainers.image.revision=${GITHUB_SHA}"
          echo "org.opencontainers.image.created=${created}"
          echo "EOF"
        } >>"$GITHUB_OUTPUT"

    - name: Log in to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push (clean build, never from a shared layer cache)
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        build-args: ${{ inputs.build-args }}
        platforms: linux/amd64
        push: true
        provenance: false
        sbom: false
        no-cache: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Pushed reference
      id: out
      shell: bash
      env:
        REPO: ${{ steps.meta.outputs.repo }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::no image digest from the build"; exit 1; }
        echo "ref=${REPO}@${DIGEST}" >>"$GITHUB_OUTPUT"
        echo "digest=${DIGEST}" >>"$GITHUB_OUTPUT"

    - name: Image checks
      shell: bash
      env:
        REF: ${{ steps.out.outputs.ref }}
      run: |
        docker pull --quiet "$REF"
        bash scripts/supply-chain/check-image.sh --require-labels "$REF"

    - name: SBOM (Syft, SPDX JSON)
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ steps.out.outputs.ref }}
        format: spdx-json
        output-file: sbom.spdx.json
        syft-version: v1.54.1
        upload-artifact: false

    - name: Vulnerability gate (Grype)
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        sbom: sbom.spdx.json
        fail-build: true
        severity-cutoff: critical
        only-fixed: true
        output-format: sarif
        grype-version: v0.120.1

    - name: Keep the scan report
      if: always() && steps.scan.outputs.sarif != ''
      shell: bash
      env:
        SARIF: ${{ steps.scan.outputs.sarif }}
        NAME: ${{ inputs.name }}
      run: mkdir -p sarif && cp "$SARIF" "sarif/grype-${NAME}.sarif"

    - name: Sign (keyless) and attest the SBOM
      shell: bash
      env:
        REF: ${{ steps.out.outputs.ref }}
        NAME: ${{ inputs.name }}
        DOMAIN: ${{ inputs.domain }}
      run: |
        annotations=(-a "git_sha=${GITHUB_SHA}" -a "image=${NAME}")
        if [ -n "$DOMAIN" ]; then annotations+=(-a "domain=${DOMAIN}"); fi
        cosign sign --yes "${annotations[@]}" "$REF"
        cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

    - name: SLSA build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.meta.outputs.repo }}
        subject-digest: ${{ steps.out.outputs.digest }}
        push-to-registry: true

    - name: Record the reference
      shell: bash
      env:
        REF: ${{ steps.out.outputs.ref }}
        KEY: ${{ inputs.release-key }}
        NAME: ${{ inputs.name }}
      run: |
        mkdir -p refs
        printf '%s=%s\n' "$KEY" "$REF" >"refs/${NAME}.ref"
        echo "### ${NAME}" >>"$GITHUB_STEP_SUMMARY"
        echo "\`${REF}\` signed, SBOM + provenance attested" >>"$GITHUB_STEP_SUMMARY"

    - name: Upload the reference
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ref-${{ inputs.name }}
        path: refs/${{ inputs.name }}.ref
        retention-days: 7
        if-no-files-found: error
