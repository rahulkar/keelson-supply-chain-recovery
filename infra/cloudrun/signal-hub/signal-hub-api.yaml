# Cloud Run service: signal-hub-api (compose: signal-hub-api). Internal ingress only: the engine
# (engine-api / engine-worker, Direct VPC egress) calls it with service JWTs (SIGNAL_HUB_SHARED_SECRET).
# minScale 1: the API process runs the pending-extraction retries, the expiry sweep and the demo
# auto-advance loops. Demo fixtures are fetched from the instance itself (127.0.0.1:$PORT/demo-feeds).
# Rendered and applied by infra/cloudrun/signal-hub.sh (sourced by scripts/cloudrun/deploy.sh).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: signal-hub-api
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/part-of: keelson
  annotations:
    run.googleapis.com/ingress: internal
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: keelson
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        # Direct VPC egress, all traffic: Cloud SQL (private IP) and the internal-ingress LiteLLM.
        run.googleapis.com/network-interfaces: '[{"network":"${NETWORK}","subnetwork":"${SUBNET}"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      serviceAccountName: keelson-signal-hub@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 120
      containers:
        - name: signal-hub-api
          image: ${IMAGE_SIGNAL_HUB}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          env:
            - name: LITELLM_BASE_URL
              value: ${URL_LITELLM}
            - name: DEMO_MODE
              value: "${DEMO_MODE}"
            - name: SIGNALS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: keelson-signals-database-url
                  key: latest
            - name: SIGNAL_HUB_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: keelson-signal-hub-shared-secret
                  key: latest
            # dedicated LiteLLM virtual key for news extraction; the literal value "unset" (no key
            # provisioned) leaves news items pending_extraction
            - name: LITELLM_SIGNALS_KEY
              valueFrom:
                secretKeyRef:
                  name: keelson-litellm-signals-key
                  key: latest
