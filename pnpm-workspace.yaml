# Keelson web workspace. Merxa (apps/merxa-web) is a SEPARATE product with its own lockfile and is
# deliberately NOT part of this workspace (it must never import @keelson/*).
packages:
  - apps/keelson-web
  - packages/tokens-keelson
  - packages/ui-keelson
  - packages/viz
  - packages/contracts-ts

# Install scripts (pnpm 10 runs none unless allowed). unrs-resolver (eslint-config-next →
# eslint-import-resolver-typescript) ships a `napi-postinstall … check` that is not needed: its
# prebuilt platform binding is an optionalDependency in the lockfile and is installed normally.
# Allowing it (onlyBuiltDependencies) was tried and is NOT safe: on a fresh install (Docker build)
# the check runs before pnpm's hidden hoisting exists, fails to resolve the binding and downloads
# it from registry.npmjs.org despite --offline. Listing it as ignored silences the
# "Ignored build scripts" warning without running anything.
ignoredBuiltDependencies:
  - unrs-resolver

# Supply-chain cooling-off (docs/supply-chain.md): never resolve a version published less than 3 days
# (4320 minutes) ago - the same minimum as renovate.json `minimumReleaseAge`, so a hijacked release is
# usually yanked before anyone here can install it. Only resolution is affected: `pnpm install
# --frozen-lockfile` installs the locked versions as before. scripts/supply-chain/check_pins.py (P8)
# keeps this, apps/merxa-web/pnpm-workspace.yaml and renovate.json equal.
minimumReleaseAge: 4320
