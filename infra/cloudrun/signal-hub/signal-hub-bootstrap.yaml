# Cloud Run job: signal-hub-bootstrap (compose: signal-hub-bootstrap, one-shot). Role + database
# `signals` + PostGIS (pinned PIN_POSTGIS) with the Cloud SQL admin user, then the migrations as role
# `signals`. Executed by infra/cloudrun/signal-hub.sh after keelson-db-init, before signal-hub-api.
# Runs as keelson-jobs: only this job can read the admin DSN (the API's account cannot).
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: signal-hub-bootstrap
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/part-of: keelson
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/network-interfaces: '[{"network":"${NETWORK}","subnetwork":"${SUBNET}"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: keelson-jobs@${PROJECT}.iam.gserviceaccount.com
          maxRetries: 2
          timeoutSeconds: 600
          containers:
            - name: bootstrap
              image: ${IMAGE_SIGNAL_HUB}
              command: ["python", "-m", "signal_hub.bootstrap"]
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: SIGNALS_POSTGIS_VERSION
                  value: "${PIN_POSTGIS}"
                - name: SIGNALS_ADMIN_DSN
                  valueFrom:
                    secretKeyRef:
                      name: keelson-signals-admin-dsn
                      key: latest
                - name: SIGNALS_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keelson-signals-db-password
                      key: latest
                - name: SIGNALS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: keelson-signals-database-url
                      key: latest
