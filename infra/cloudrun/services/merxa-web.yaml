# Cloud Run service: merxa-web (compose: merxa-web), the UI of the mock third party.
# Public only through the ALB (merxa.<domain>, every path not routed to merxa-api). Server
# components call merxa-api on its run.app URL through the VPC.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: merxa-web
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/part-of: merxa
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: merxa
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/network-interfaces: '[{"network":"${NETWORK}","subnetwork":"${SUBNET}"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      serviceAccountName: merxa-web@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: merxa-web
          image: ${IMAGE_MERXA_WEB}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: MERXA_API_INTERNAL_URL
              value: ${URL_MERXA_API}
