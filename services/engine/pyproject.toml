[project]
name = "keelson-engine"
version = "0.1.0"
description = "Keelson engine: FastAPI BFF/API + ADK 2.11 agent runtime + worker"
requires-python = ">=3.14,<3.15"
dependencies = [
  "keelson-contracts[agui]",
  "google-adk[db,mcp]==2.11.0",
  "mcp==2.3.0",
  "litellm==1.104.0",
  "fastmcp==4.0.11",
  "ag-ui-protocol==1.0.0",
  "fastapi>=0.135,<0.143",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings>=2.11",
  "sqlalchemy[asyncio]==2.1.3",
  "asyncpg==0.31.0",
  "redis>=6.0",
  "authlib==1.8.0",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "structlog>=25.1",
  "pyyaml>=6.0.2",
  "pyarrow>=21",
  "duckdb==1.5.5",
  "pypdf>=6",
  "cel-expr-python==0.1.3",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2", "respx>=0.22"]

[tool.uv.sources]
keelson-contracts = { path = "../../packages/contracts-py", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keelson_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real LiteLLM/Gemini (opt-in)", "integration: needs compose services"]
addopts = "-m 'not live and not integration'"
