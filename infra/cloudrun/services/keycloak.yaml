# Cloud Run service: keycloak (compose: keycloak). Image: infra/cloudrun/images/keycloak.Dockerfile
# (`kc.sh build` with KC_DB=postgres, health on, cache=local; CMD `start --optimized --cache=local`).
# --cache=local keeps sessions in this instance's memory, so the service runs with
# min = max = 1 and CPU always allocated. Browsers reach it only as auth.<domain> through the ALB
# (Cloud Armor blocks /admin* and /realms/master*); engine services and the kc-config job use the
# run.app URL through the VPC (backchannel, admin API).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: keycloak
  labels:
    cloud.googleapis.com/location: ${REGION}
    app.kubernetes.io/part-of: keelson
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: keelson
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/network-interfaces: '[{"network":"${NETWORK}","subnetwork":"${SUBNET}"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: keelson-keycloak@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 200
      timeoutSeconds: 300
      containers:
        - name: keycloak
          image: ${IMAGE_KEYCLOAK}
          args: ["start", "--optimized", "--cache=local"]
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            # Keycloak 26.8 opens 8080 while it is still bootstrapping and answers 503 on every
            # path until it is ready (measured by scripts/cloudrun/parity-check.sh), so a TCP probe
            # would pass too early. /health/* lives on the management port 9000; /realms/master
            # on 8080 is 200 only once Keycloak is up (first boot = schema creation, ~2-3 min on 1 CPU).
            httpGet:
              path: /realms/master
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 24
          env:
            - name: KC_DB_URL
              value: jdbc:postgresql://${CORE_SQL_IP}:5432/keycloak?sslmode=require
            - name: KC_DB_USERNAME
              value: keycloak
            # Issuer = https://auth.<domain>/realms/<realm> for every caller (front and back
            # channel); the backchannel may use the run.app host.
            - name: KC_HOSTNAME
              value: https://auth.${DOMAIN}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # TLS ends at the Google front end; it sets X-Forwarded-For/-Proto.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: JAVA_OPTS_KC_HEAP
              value: "-XX:MaxRAMPercentage=60 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keelson-keycloak-db-password
                  key: latest
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keelson-kc-admin-password
                  key: latest
