# Demo pack (docs/contracts/100-m6-signals.md §7, Act 1). SIMULATED: fictional Typhoon KESTREL-26 and a
# fictional outlet ("Demo Freight Daily"). Replayed by the Signal Hub through the real GDACS and RSS
# adapters (fixtures served at /demo-feeds/typhoon-hcmc/<file>); everything it produces is origin demo /
# provenance simulated and alerts carry simulated: true (DEMO badge).
# Fixtures gdacs-adv*.geojson are generated by data/scenarios/tools/gen_typhoon_hcmc.py (do not hand-edit).
# Check with: python data/scenarios/validate.py typhoon-hcmc   (expected exposures: expected.yaml)
id: typhoon-hcmc
title: Typhoon Kestrel approaching Ho Chi Minh City (simulated)
description: >-
  SIMULATED. Four GDACS-shaped tropical-cyclone advisories, 6 hours apart, for the fictional Typhoon
  KESTREL-26 tracking west across the South China Sea towards Ho Chi Minh City (alert level Orange,
  Orange, Red, Red; the forecast cone narrows onto Cat Lai / VNSGN), plus one trade-press item from the
  fictional outlet Demo Freight Daily reporting that Cat Lai terminal suspends operations (pre-baked
  extraction, no LLM needed). Expected exposure: port VNSGN, factory F-VN-01, supplier SUP-VN-01 and the
  SGN-* lanes (plus the Cambodian nodes within the 300 km TC radius).
start_at: "2026-10-05T00:00:00Z"
steps:
  - t_offset_s: 0
    adapter: gdacs
    payload: {fixture: gdacs-adv1.geojson}
    note: "Advisory 1 (00:00Z): Orange, 130 km/h, 570 km east of Ho Chi Minh City; the forecast cone already covers Cat Lai"
  - t_offset_s: 21600
    adapter: gdacs
    payload: {fixture: gdacs-adv2.geojson}
    note: "Advisory 2 (06:00Z): Orange, 150 km/h; the cone shifts south onto Ho Chi Minh City"
  - t_offset_s: 43200
    adapter: gdacs
    payload: {fixture: gdacs-adv3.geojson}
    note: "Advisory 3 (12:00Z): Red, 175 km/h; landfall forecast near Vung Tau within 12 h (severity jump re-notifies; a case is drafted)"
  - t_offset_s: 50400
    adapter: rss
    payload:
      fixture: news-demo-freight-daily.xml
      connector_id: rss.demo-freight-daily
      source_name: Demo Freight Daily
      extractions:
        "https://demo-freight-daily.example/?p=26101":
          kind: logistics
          subtype: port_closure
          places: ["Ho Chi Minh City"]
          companies: []
          ports: ["Cat Lai terminal"]
          chokepoints: []
          dates_text: ["from 21:00 local time on Monday", "until the storm passes"]
          injection_suspected: false
    note: "Demo Freight Daily (fictional): Cat Lai terminal suspends operations; attaches to the typhoon event (VNSGN)"
  - t_offset_s: 64800
    adapter: gdacs
    payload: {fixture: gdacs-adv4.geojson}
    note: "Advisory 4 (18:00Z): Red, 185 km/h, about 145 km east of Ho Chi Minh City, just off the Binh Thuan coast; the cone is centred on Ho Chi Minh City"
  - t_offset_s: 64800
    adapter: chat_hint
    payload: {text: "Open the alert, then ask: what if Cat Lai stays closed for 10 days?"}
    note: "Presenter hint"
