[project]
name = "merxa-api"
version = "0.1.0"
description = "Merxa Retail Suite backend (mock third-party ERP): REST /v1, MCP /mcp, change-sets, audit."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "httpx2>=2.13,<3",
    "fastmcp==4.0.11",
    "mcp==2.3.0",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",
    "uvicorn[standard]==0.54.0",
    "numpy>=2.3",
    "pyarrow>=21",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[project.scripts]
merxa-api = "merxa_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merxa_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]
