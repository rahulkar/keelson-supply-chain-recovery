# egress - the only path for Keelson connector traffic to third parties
# (CONNECTOR_PROXY_URL=http://egress:3128). Squid 6 (ubuntu/squid).
#
# Policy (first match wins):
#   1. only clients on private (docker) networks may use the proxy
#   2. only ports 80/443; CONNECT only to 443
#   3. dev-host exceptions: merxa.localhost (the mock vendor, served by Caddy) and the
#      vendor's authorization server path on auth.localhost/realms/merxa (plain HTTP)
#   4. deny compose service names / single-label hosts and *.localhost / internal TLDs
#   5. deny private, loopback, link-local (incl. cloud metadata), CGNAT, ULA destinations
#      (checked against the resolved IP, so DNS names pointing inside are denied too)
#   6. allow everything else (public internet)
# No caching; small memory footprint. Logs go to /var/log/squid/*.log, which the
# image entrypoint tails to stdout.

http_port 3128
visible_hostname egress

# ── clients ────────────────────────────────────────────────────────────────────
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7

# ── ports / methods ─────────────────────────────────────────────────────────────
acl SSL_ports port 443
acl HTTP_port port 80
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# ── dev-host exceptions (resolve to Caddy on the edge network) ──────────────────
acl dev_hosts dstdomain merxa.localhost
acl kc_host dstdomain auth.localhost
acl merxa_realm urlpath_regex ^/realms/merxa(/|$)

# ── internal names ──────────────────────────────────────────────────────────────
# Single-label names = compose service names / container names.
acl single_label dstdom_regex ^[^.]+$
acl internal_names dstdomain caddy egress keycloak kc-config pg-core pg-litellm pg-merxa
acl internal_names dstdomain valkey valkey-litellm litellm phoenix bootstrap engine-api
acl internal_names dstdomain engine-worker optimizer merxa-api merxa-web keelson-web
acl internal_names dstdomain host.docker.internal gateway.docker.internal
acl internal_tlds dstdomain .localhost .local .internal .lan .home.arpa .localdomain

# ── private / special destination ranges (matched on resolved IPs) ─────────────
acl private_dst dst 0.0.0.0/8
acl private_dst dst 10.0.0.0/8
acl private_dst dst 100.64.0.0/10
acl private_dst dst 127.0.0.0/8
acl private_dst dst 169.254.0.0/16
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.0.0.0/24
acl private_dst dst 192.168.0.0/16
acl private_dst dst 198.18.0.0/15
acl private_dst dst 224.0.0.0/4
acl private_dst dst 240.0.0.0/4
acl private_dst dst ::1
acl private_dst dst fc00::/7
acl private_dst dst fe80::/10

# ── access rules ────────────────────────────────────────────────────────────────
http_access deny !localnet
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager

# Dev exceptions: plain HTTP on port 80 only (no CONNECT tunnels to internal hosts).
http_access allow dev_hosts HTTP_port !CONNECT
http_access allow kc_host merxa_realm HTTP_port !CONNECT

http_access deny single_label
http_access deny internal_names
http_access deny internal_tlds
http_access deny to_localhost
http_access deny to_linklocal
http_access deny private_dst

http_access allow localnet
http_access deny all

# Notes: `dst` ACLs are evaluated on the addresses Squid resolved for the request and
# the upstream connection uses the same ipcache entry, so a public name that resolves
# to an internal address is denied. Redirects are returned to the client (not followed
# by Squid), so a 30x to e.g. 169.254.169.254 is re-checked against these rules.

# ── privacy / headers ───────────────────────────────────────────────────────────
forwarded_for delete
via on
httpd_suppress_version_string on
request_header_access Proxy-Authorization deny all

# ── no caching, small footprint ─────────────────────────────────────────────────
# Docker's default nofile limit is 1048576 and Squid sizes its per-FD tables from it
# (~130 MB RSS); 4096 is plenty for the connector traffic of one dev stack.
max_filedescriptors 4096
# The ICMP pinger helper is not needed (no ICP/netdb peer selection).
pinger_enable off
cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 64 KB
memory_pools off
ipcache_size 1024
fqdncache_size 1024
client_db off
pipeline_prefetch 0
coredump_dir /var/spool/squid
shutdown_lifetime 3 seconds

# Generous timeouts for long-lived MCP/SSE responses through the proxy.
read_timeout 15 minutes
request_timeout 2 minutes
connect_timeout 15 seconds

logformat keelson %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a
access_log daemon:/var/log/squid/access.log logformat=keelson
cache_log /var/log/squid/cache.log
cache_store_log none
